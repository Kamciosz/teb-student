name: CI

on:
  push:
    branches: [main]
  pull_request:

# PL: Workflow tylko czyta repozytorium. Bez tego token dostaje domyślne, szersze uprawnienia.
# EN: The workflow only reads the repository. Without this the token gets the default, wider permissions.
permissions:
  contents: read

jobs:
  commits:
    name: Format commitów
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sprawdź każdy commit hookiem z repozytorium
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            sh .githooks/commit-msg "$RUNNER_TEMP/msg" || { echo "Commit $sha"; exit 1; }
          done

  build:
    name: Build i testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint i typy
        run: npm run lint --if-present
      - name: Testy
        run: npm test --if-present
      - name: Build
        run: npm run build --if-present
      # PL: Pobierz Chromium i biblioteki systemowe, których potrzebuje. Bez tego test e2e nie ma przeglądarki.
      # EN: Download Chromium and the system libraries it needs. Without this the e2e test has no browser.
      - name: Przeglądarka do testów e2e
        run: npx playwright install --with-deps chromium
      # PL: Uruchom test całych ścieżek. Playwright sam startuje serwer (playwright.config.ts, webServer) na porcie 5173, bo PORT nie jest ustawiony.
      # EN: Run the end-to-end tests. Playwright starts the server itself (playwright.config.ts, webServer) on port 5173, because PORT is not set.
      - name: Testy e2e
        run: npm run test:e2e
